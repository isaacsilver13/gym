[project]
name = "gym-tracker"
version = "0.1.0"
description = "Workout routine builder and progress tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "psycopg[binary]>=3.0,<4.0",
    "pydantic>=2.9,<3.0",
    "python-dotenv>=1.0,<2.0",
    "bcrypt>=4.2,<5.0",
    "itsdangerous>=2.2,<3.0",
    "httpx>=0.27,<1.0",
    "tzdata>=2025.1",
    "garmin-fit-sdk==21.218.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
